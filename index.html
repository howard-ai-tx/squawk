<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Howard AI — Early Adopters</title>
  <meta name="description" content="Howard AI Early Adopter Platform.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/css/style.css?v=13">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
</head>
<body>

  <!-- Login view (unauthenticated) -->
  <div data-view="login"></div>

  <!-- Activation view (unauthenticated, reached via one-time link) -->
  <div data-view="activate"></div>

  <!-- Authenticated shell -->
  <div class="app-shell hidden" id="app-shell">
    <header class="app-topbar">
      <img class="app-logo" src="logo-dark.png" alt="Howard AI">
      <button class="app-nav-toggle" id="app-nav-toggle" aria-label="Open menu" aria-expanded="false">
        <i class="ti ti-menu-2" style="font-size:20px"></i>
      </button>
      <nav class="app-nav" id="app-nav" aria-label="Main navigation">
        <button class="app-nav-close" aria-label="Close menu">
          <i class="ti ti-x" style="font-size:20px"></i>
        </button>
        <button class="app-nav-link" data-target="home">Home</button>
        <button class="app-nav-link" data-target="feedback">Feedback/Suggestions</button>
        <button class="app-nav-link" data-target="bug">Report a Bug</button>
        <button class="app-nav-link" data-target="contact">Contact Us</button>
        <div class="app-nav-dropdown-wrap" id="resources-dropdown-wrap">
          <button class="app-nav-link app-nav-dropdown-trigger" id="resources-trigger" aria-haspopup="true" aria-expanded="false">
            Resources <i class="ti ti-chevron-down" style="font-size:16px"></i>
          </button>
          <div class="app-nav-dropdown" id="resources-dropdown" role="menu">
            <button class="app-nav-link app-nav-dropdown-link" data-target="representing" role="menuitem">Representing HowardAI</button>
            <button class="app-nav-link app-nav-dropdown-link" data-target="refer" role="menuitem">Refer Someone</button>
          </div>
        </div>
        <span class="app-nav-divider-v" aria-hidden="true"></span>
        <button class="app-nav-link app-nav-signout" id="btn-signout">
          <i class="ti ti-logout" style="font-size:17px"></i> Sign Out
        </button>
      </nav>
      <nav class="app-nav" id="admin-nav" aria-label="Administrator navigation">
        <button class="app-nav-close" aria-label="Close menu">
          <i class="ti ti-x" style="font-size:20px"></i>
        </button>
        <button class="app-nav-link" data-target="admin-overview">Overview</button>
        <button class="app-nav-link" data-target="admin-eas">Early Adopters</button>
        <button class="app-nav-link" data-target="admin-feedback">Feedback</button>
        <button class="app-nav-link" data-target="admin-bugs">Bug Reports</button>
        <button class="app-nav-link" data-target="admin-contact">Messages</button>
        <span class="app-nav-divider-v" aria-hidden="true"></span>
        <button class="app-nav-link app-nav-signout" id="btn-signout-admin">
          <i class="ti ti-logout" style="font-size:17px"></i> Sign Out
        </button>
      </nav>
    </header>

    <main class="app-main">
      <div data-view="home"></div>
      <div data-view="feedback"></div>
      <div data-view="bug"></div>
      <div data-view="contact"></div>
      <div data-view="representing"></div>
      <div data-view="refer"></div>
      <div data-view="admin-overview"></div>
      <div data-view="admin-eas"></div>
      <div data-view="admin-ea-detail"></div>
      <div data-view="admin-feedback"></div>
      <div data-view="admin-bugs"></div>
      <div data-view="admin-contact"></div>
    </main>
  </div>

  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="assets/js/data.js?v=11"></script>
  <script src="assets/js/app.js?v=22"></script>
</body>
</html>
